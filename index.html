<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wallet Keys</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
  <h1>🔐 Wallet Keys</h1>
  <p class="app-subtitle">Локальне зберігання · AES-256-GCM · PBKDF2 · 200k ітерацій</p>

  <!-- Lock warning banner -->
  <div class="lock-banner" id="lockBanner">
    ⏱ Сесія закінчиться через <span id="lockCountdown">5:00</span> хвилин без активності
  </div>

  <!-- Login block -->
  <div id="loginBlock">
    <div class="field">
      <label>Мастер-пароль</label>
      <input type="password" id="masterPassword" placeholder="Введіть мастер-пароль" autocomplete="off" />
    </div>
    <div class="attempts-bar" id="attemptsBar">
      <div class="attempt-dot" id="d0"></div>
      <div class="attempt-dot" id="d1"></div>
      <div class="attempt-dot" id="d2"></div>
      <div class="attempt-dot" id="d3"></div>
      <div class="attempt-dot" id="d4"></div>
    </div>
    <button class="btn btn-primary" id="unlockBtn" style="margin-top:14px">Розблокувати</button>
  </div>

  <div id="status" class="status"></div>

  <!-- Wallets block -->
  <div id="keysContainer" class="hidden">
    <div class="divider"></div>
    <div class="wallets-header">
      <h3>Кошельки</h3>
      <span class="wallet-count" id="walletCount"></span>
    </div>
    <div id="keysList"></div>
    <button class="btn btn-add" id="addWalletBtn">+ Додати гаманець</button>
    <button class="btn btn-lock" id="lockBtn">🔒 Заблокувати</button>
    <div class="clipboard-notice" id="clipNotice"></div>
  </div>
</div>

<!-- Modal: Add Wallet -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>Новий гаманець</h3>
    <div class="field">
      <label>Адреса (0x...)</label>
      <input type="text" id="mAddress" placeholder="0x..." autocomplete="off" />
    </div>
    <div class="field">
      <label>Сід-фраза (seed phrase)</label>
      <input type="password" id="mSeed" placeholder="слово1 слово2 ... слово12" autocomplete="off" />
    </div>
    <div class="field">
      <label>Приватний ключ (якщо є)</label>
      <input type="password" id="mPk" placeholder="0x..." autocomplete="off" />
    </div>
    <div class="modal-btns">
      <button class="btn btn-cancel" id="modalCancel">Скасувати</button>
      <button class="btn btn-save" id="modalSave">Зберегти</button>
    </div>
  </div>
</div>

<script src="./index.js"></script>
</body>
</html>
